<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1B2838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jay's Valet">
<title>Jay's Valet</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="../../images/jays-air-center-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="appwrap">
    <div class="envbar" id="envbar"></div>
    <div class="notif" id="notif">
      <div class="nico" id="notifIco">✈</div>
      <div class="ntx"><b id="notifTitle">Jay's Valet</b><span id="notifBody"></span></div>
    </div>
    <div class="app" id="root"><div class="spinner"></div></div>
  </div>
  <script type="module" src="./js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
