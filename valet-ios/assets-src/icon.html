<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  .icon{width:1024px;height:1024px;background:linear-gradient(160deg,#1B2838 0%,#22344a 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .ring{position:absolute;width:760px;height:760px;border-radius:50%;border:6px solid rgba(201,165,91,.28)}
  .plane{font-size:380px;color:#C9A55B;transform:rotate(-18deg);line-height:1;
    text-shadow:0 24px 60px rgba(0,0,0,.35)}
  .word{margin-top:34px;font-family:'Cinzel',serif;font-size:74px;letter-spacing:.26em;color:#E8DCC4;text-indent:.26em}
</style></head>
<body><div class="icon"><div class="ring"></div><div class="plane">✈</div><div class="word">JRV</div></div></body></html>
